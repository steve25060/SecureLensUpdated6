services:
  # ============================================================================
  # 1. NestJS Backend API Service
  # ============================================================================
  - type: web
    name: securelens-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm run build:backend
    startCommand: cd apps/backend && npx prisma db push --accept-data-loss && node dist/main.js
    healthCheckPath: /api/ai-copilot/status
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: securelens-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://securelens-frontend.onrender.com
      - key: FRONTEND_ORIGIN
        value: https://securelens-frontend.onrender.com
      - key: BACKEND_URL
        value: https://securelens-backend-o213.onrender.com
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://securelens-backend-o213.onrender.com/api/auth/google/callback
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        value: https://securelens-backend-o213.onrender.com/api/auth/github/callback

  # ============================================================================
  # 2. Next.js Frontend Application
  # ============================================================================
  - type: web
    name: securelens-frontend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install -g pnpm && pnpm install --frozen-lockfile && pnpm run build:frontend
    startCommand: pnpm run start:frontend
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://securelens-backend-o213.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://securelens-backend-o213.onrender.com/api
      - key: NEXT_PUBLIC_APP_URL
        value: https://securelens-frontend.onrender.com

# ============================================================================
# 3. PostgreSQL Database
# ============================================================================
databases:
  - name: securelens-db
    databaseName: securelens
    user: securelens
    plan: free
    region: oregon
    ipAllowList: []
